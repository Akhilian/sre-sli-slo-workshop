# SLO de couverture des notifications : à compléter.
#
# Question : chaque document traité donne-t-il bien lieu à une notification ?
# Indice : la perte d'une notification ne produit ni erreur ni log.
#
# Métriques disponibles :
#   notifications_enqueued_total             notifications demandées (rôle worker)
#   notifications_sent_total{status="ok"}    notifications envoyées (rôle notifier)
#   notification_delay_seconds_*             délai entre la demande et l'envoi
#
# Appliquer : kubectl apply -f sloth/notification-coverage.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: docshare-notification-coverage
spec:
  service: docshare-notifications
  slos:
    - name: coverage
      objective: TODO
      sli:
        events:
          # TODO : comment compter les notifications perdues ?
          errorQuery: TODO
          # TODO : quelles notifications comptent ?
          totalQuery: TODO
      alerting:
        name: DocshareNotificationCoverage
        pageAlert:
          labels: { severity: page }
        ticketAlert:
          labels: { severity: ticket }
