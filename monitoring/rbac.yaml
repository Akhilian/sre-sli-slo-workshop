# Ajoute au rôle « edit » (celui des équipes) le droit de gérer leurs SLO et de
# lire les règles générées par Sloth dans leur namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: docshare-slo-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [sloth.slok.dev]
    resources: [prometheusservicelevels]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    verbs: [get, list, watch]
