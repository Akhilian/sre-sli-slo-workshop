# Nom de l'équipe, affiché dans les labels. Le namespace porte déjà l'isolation.
team: ""

image:
  # Image publiée par .github/workflows/image.yml (remplacer OWNER).
  repository: ghcr.io/OWNER/docshare
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

worker:
  # Capacité fixe : 1 réplique × 4 threads ≈ 2 jobs/s. Pas d'autoscaling,
  # sinon worker_slow serait absorbé et la fraîcheur ne bougerait plus.
  concurrency: 4
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

notifier:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

redis:
  image: redis:7.4-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  image: postgres:16-alpine
  storage: 2Gi
  # Données factices d'un atelier : un mot de passe fixe suffit.
  password: docshare
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Quota du namespace : pile complète (k6 compris) + 50 % de marge.
quota:
  requests: { cpu: 900m, memory: 1536Mi }
  limits: { cpu: "3", memory: 3Gi }
  pods: "15"
  storage: 5Gi

ingress:
  enabled: false
  className: ""
  host: ""
