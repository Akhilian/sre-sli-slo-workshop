apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels: {{- include "docshare.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notifier }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        {{- include "docshare.labels" . | nindent 8 }}
    spec:
      containers:
        - name: notifier
          image: {{ include "docshare.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: ROLE, value: notifier }
            {{- include "docshare.env" . | nindent 12 }}
          ports:
            - { name: metrics, containerPort: 9100 }
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
          resources: {{- toYaml .Values.notifier.resources | nindent 12 }}
