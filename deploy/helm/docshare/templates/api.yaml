apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "docshare.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "docshare.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        {{- include "docshare.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "docshare.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: ROLE, value: api }
            {{- include "docshare.env" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8000 }
          # /healthz ignore les pannes : upload_latency ne fait pas redémarrer le pod.
          # La sonde de démarrage laisse le temps d'attendre Redis et Postgres.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
