{{- if .Values.k6.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  labels: {{- include "docshare.labels" . | nindent 4 }}
data:
  traffic.js: |-
{{ .Files.Get "k6/traffic.js" | indent 4 }}
---
# Le nom suit la révision Helm : relancer deploy/scripts/setup.sh remplace le Job
# (le spec d'un Job est immuable) et repart pour une durée complète.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: k6
    {{- include "docshare.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        {{- include "docshare.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: {{ .Values.k6.image }}
          args: [run, --quiet, /scripts/traffic.js]
          env:
            - { name: API_URL, value: http://api }
            - { name: UPLOAD_RATE, value: {{ .Values.k6.uploadRate | quote }} }
            - { name: SEARCHES_PER_DOC, value: {{ .Values.k6.searchesPerDoc | quote }} }
            - { name: DURATION, value: {{ .Values.k6.duration | quote }} }
          resources: {{- toYaml .Values.k6.resources | nindent 12 }}
          volumeMounts:
            - { name: script, mountPath: /scripts }
      volumes:
        - name: script
          configMap: { name: k6-script }
{{- end }}
