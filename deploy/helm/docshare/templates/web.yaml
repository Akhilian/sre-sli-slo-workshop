{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "docshare.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "docshare.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        {{- include "docshare.labels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - { name: API_URL, value: {{ .Values.web.apiUrl | quote }} }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
{{- end }}
