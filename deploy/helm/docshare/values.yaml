# Nom de l'équipe, affiché dans les labels. Le namespace porte déjà l'isolation.
team: ""

image:
  # Image publiée par .github/workflows/image.yml (remplacer OWNER).
  repository: ghcr.io/OWNER/docshare
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Interface Vue servie par nginx ; les appels /api/ sont relayés vers l'API.
# enabled: false retire l'interface sans toucher au reste de la pile.
web:
  enabled: true
  image:
    repository: ghcr.io/OWNER/docshare-web
    tag: latest
    pullPolicy: IfNotPresent
  apiUrl: http://api
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

worker:
  # Capacité fixe : 1 réplique × 4 threads ≈ 2 jobs/s. Pas d'autoscaling,
  # sinon worker_slow serait absorbé et la fraîcheur ne bougerait plus.
  concurrency: 4
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

notifier:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

redis:
  image: redis:7.4-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  image: postgres:16-alpine
  storage: 2Gi
  # Données factices d'un atelier : un mot de passe fixe suffit.
  password: docshare
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Trafic constant (Job k6, script dans k6/traffic.js). Chaque upload est suivi
# jusqu'à « done » (~1 à 2 consultations) puis recherché searchesPerDoc fois.
k6:
  enabled: true
  image: grafana/k6:1.4.0
  uploadRate: 1
  searchesPerDoc: 2
  duration: 3h
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Quota du namespace : pile complète (k6 compris) + 50 % de marge, et de quoi
# remplacer l'API lors d'une mise à jour.
quota:
  requests: { cpu: 900m, memory: 1536Mi }
  limits: { cpu: "4", memory: 4Gi }
  pods: "15"
  storage: 5Gi

ingress:
  enabled: false
  className: ""
  host: ""
